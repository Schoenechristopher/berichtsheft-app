# Demo-Umgebung: docker compose up
# App http://localhost:3000 · Keycloak http://localhost:8080 · Mailpit http://localhost:8025
name: berichtsheft

x-app-environment: &app-environment
  TZ: Europe/Berlin
  DATABASE_URL: postgresql://${POSTGRES_USER:-berichtsheft}:${POSTGRES_PASSWORD:-berichtsheft}@db:5432/${POSTGRES_DB:-berichtsheft}
  APP_URL: ${APP_URL:-http://localhost:3000}
  AUTH_URL: ${APP_URL:-http://localhost:3000}
  AUTH_SECRET: ${AUTH_SECRET:-demo-secret-nur-fuer-lokalen-betrieb-aendern}
  AUTH_TRUST_HOST: "true"
  # Browser erreicht Keycloak unter localhost, die App im Docker-Netz unter keycloak:8080.
  AUTH_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/berichtsheft
  AUTH_OIDC_INTERNAL_ISSUER: http://keycloak:8080
  AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-berichtsheft-app}
  AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-berichtsheft-demo-secret}
  AUTH_OIDC_ACCOUNT_ID_CLAIM: ${AUTH_OIDC_ACCOUNT_ID_CLAIM:-sub}
  AUTH_OIDC_EMAIL_CLAIM: ${AUTH_OIDC_EMAIL_CLAIM:-email}
  AUTH_OIDC_EMAIL_VERIFIED_CLAIM: ${AUTH_OIDC_EMAIL_VERIFIED_CLAIM:-email_verified}
  AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-Firmenkonto}
  # Benachrichtigungen: E-Mail an Mailpit im Docker-Netz, Teams ins Entwickler-Postfach (Demo).
  # Host und Port fest, damit eine lokale .env (SMTP_HOST=localhost) die Demo nicht umlenkt.
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: "${SMTP_FROM:-Berichtsheft <berichtsheft@example.test>}"
  TEAMS_MODE: ${TEAMS_MODE:-entwickler-postfach}
  TEAMS_GRAPH_TENANT_ID: ${TEAMS_GRAPH_TENANT_ID:-}
  TEAMS_GRAPH_CLIENT_ID: ${TEAMS_GRAPH_CLIENT_ID:-}
  TEAMS_GRAPH_CLIENT_SECRET: ${TEAMS_GRAPH_CLIENT_SECRET:-}
  NOTIFICATION_POLL_SECONDS: "${NOTIFICATION_POLL_SECONDS:-5}"
  NOTIFICATION_MAX_ATTEMPTS: "${NOTIFICATION_MAX_ATTEMPTS:-8}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-berichtsheft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-berichtsheft}
      POSTGRES_DB: ${POSTGRES_DB:-berichtsheft}
      TZ: Europe/Berlin
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-berichtsheft.json:/opt/keycloak/data/import/realm-berichtsheft.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      TZ: Europe/Berlin
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build: .
    image: berichtsheft-app:local
    environment:
      <<: *app-environment
      SEED_DEMO_DATA: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    image: berichtsheft-app:local
    pull_policy: never
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment: *app-environment
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  db-data:
