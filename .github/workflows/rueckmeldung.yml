name: Rückmeldung

# CI-38: schreibt nach jedem abgeschlossenen CI-Lauf eines PRs einen kurzen Kommentar. Grüne Läufe erzeugen sonst
# kein Ereignis für Sitzungen, die den PR abonnieren. Kein Checkout und kein Code aus dem PR: Der Workflow liest nur
# Metadaten des Laufs (Jobs-API) und schreibt einen Kommentar. Läuft (wie jeder workflow_run) nur mit der
# Datei vom Standardzweig.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# CI-27: nur, was der Kommentar braucht. Kein contents-Recht (kein Checkout).
permissions:
  actions: read
  pull-requests: write

jobs:
  rueckmeldung:
    name: Rückmeldung
    # Läufe aus merge_group, push, schedule und workflow_dispatch gehören zu keinem PR. Abgebrochene Läufe
    # (CI-15: ein neuer Push bricht den alten ab) bleiben stumm, sonst steht unter jedem Push ein Kommentar
    # „abgebrochen“, und der Kommentar des neuen Laufs folgt ohnehin.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ergebnis als Kommentar an den PR schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_AUS_LAUF: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -eu
          pr="$PR_AUS_LAUF"
          if [ -z "$pr" ]; then
            # Rückfall: PR über den Commit suchen (die Liste im Ereignis ist z. B. bei Forks leer).
            pr=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "Kein offener PR zu Commit $HEAD_SHA, kein Kommentar."
            exit 0
          fi

          ergebnis=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "Prüfung abgeschlossen") | .conclusion')
          case "$ergebnis" in
            success) text='**grün**' ;;
            failure) text='**rot**' ;;
            cancelled) text='**abgebrochen**' ;;
            *)
              echo "Job „Prüfung abgeschlossen“ ohne Ergebnis (${ergebnis:-nicht gefunden}), kein Kommentar."
              exit 0
              ;;
          esac

          kurz=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          gh pr comment "$pr" --body "<!-- ci-rueckmeldung sha=$HEAD_SHA -->
          Prüfung abgeschlossen: $text – Commit \`$kurz\`, [Lauf]($RUN_URL)"
