name: CI

# Umfang der Prüfung nach docs/ci-richtlinie.md: Der Job „Umfang“ ordnet die Änderungen den Klassen zu
# (scripts/pruefumfang), die übrigen Jobs laufen nur, wenn ihr Umfang ausgelöst ist. Pflicht-Check im Regelsatz
# für main ist allein „Prüfung abgeschlossen“ (CI-36).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  merge_group:
  schedule:
    # CI-14: Wochenlauf montags früh (04:17 UTC).
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      umfang:
        description: "voll: alle Konfigurationen (CI-35); klassen: Umfang nach den Änderungen gegenüber main"
        type: choice
        options: [voll, klassen]
        default: voll

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # CI-15: Ein neuer Push bricht die laufende Prüfung desselben PRs ab; Wochenlauf und Warteschlange nicht.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  umfang:
    name: Umfang
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      schnell: ${{ steps.umfang.outputs.schnell }}
      e2e: ${{ steps.umfang.outputs.e2e }}
      browser_voll: ${{ steps.umfang.outputs.browser_voll }}
      liferay625: ${{ steps.umfang.outputs.liferay625 }}
      liferay72: ${{ steps.umfang.outputs.liferay72 }}
      liferay625_voll: ${{ steps.umfang.outputs.liferay625_voll }}
      liferay72_voll: ${{ steps.umfang.outputs.liferay72_voll }}
      # CI-37: Auswahl der Ablauf-Fälle nach Modul; leer = alle Fälle.
      ablauf_grep_invert: ${{ steps.umfang.outputs.ablauf_grep_invert }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Änderungsklassen, Umfang und Auswahl nach Modul bestimmen (CI-32 bis CI-35, CI-37)
        id: umfang
        run: node scripts/pruefumfang/index.mjs

  checks:
    name: Lint, Typecheck, Vitest
    needs: umfang
    if: needs.umfang.outputs.schnell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berichtsheft
          POSTGRES_PASSWORD: berichtsheft
          POSTGRES_DB: berichtsheft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U berichtsheft -d berichtsheft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://berichtsheft:berichtsheft@localhost:5432/berichtsheft_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatierung
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest (Logik, PDF und Datenbank)
        run: npm test
      - name: Testabdeckung der Akzeptanzkriterien (keine AK-ID ohne Test, docs/03-testabdeckung.md aktuell)
        run: npm run ak:abdeckung -- --pruefen
      - name: Code-Landkarte vollständig (jede Datei unter src/domain/ und src/lib/ erfasst)
        run: npm run landkarte -- --pruefen
      - name: Jede Datei gehört einer Änderungsklasse an (CI-34)
        run: npm run pruefumfang -- --pruefen
      - name: Beispiel-PDFs aus den Seed-Daten
        run: npm run pdf:beispiel
      - uses: actions/upload-artifact@v4
        with:
          name: beispiel-pdf
          path: beispiel-pdf/
          retention-days: 14

  e2e:
    name: Docker Compose + Playwright
    needs: [umfang, checks]
    if: needs.umfang.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Volle Prüfung normal ca. 40 Minuten seit G3 (Ablauf-Fälle in allen Browsern); Grenze nach CI-17.
    timeout-minutes: 60
    env:
      # Prüft, dass der Produktions-Build den Test-Login trotzdem nicht anbietet (e2e/produktionsmodus.spec.ts).
      AUTH_TEST_LOGIN: "true"
      E2E_LOGIN_MODE: keycloak
      E2E_BASE_URL: http://localhost:3000
      E2E_DATABASE_URL: postgresql://berichtsheft:berichtsheft@localhost:5432/berichtsheft
      # E-Mails über die Mailpit-API prüfen (Etappe 6); der Worker im Compose-Stack versendet sie.
      E2E_MAILPIT_URL: http://localhost:8025
      # CI-37: wählt die Ablauf-Fälle nicht betroffener Module ab (scripts/pruefumfang/modulauswahl.mjs); leer = alle.
      ABLAUF_GREP_INVERT: ${{ needs.umfang.outputs.ablauf_grep_invert }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Images bauen
        run: docker compose build
      - name: Demo starten (app, worker, db, keycloak, mailpit)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Dienste prüfen
        run: |
          docker compose ps
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:8080/realms/berichtsheft/.well-known/openid-configuration > /dev/null
          curl -fsS http://localhost:8025/readyz
          for i in $(seq 1 30); do docker compose logs worker | grep -q "verbunden mit pg-boss" && break; sleep 2; done
          docker compose logs worker | grep "verbunden mit pg-boss"
      # CI-19: heruntergeladene Browser aus dem Actions-Cache (Schlüssel: Playwright-Version aus dem Lockfile).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ needs.umfang.outputs.browser_voll }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright-Browser installieren (Chromium)
        if: needs.umfang.outputs.browser_voll != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright-Browser installieren (Chromium, Firefox, Microsoft Edge)
        if: needs.umfang.outputs.browser_voll == 'true'
        run: |
          npx playwright install --with-deps chromium firefox
          # Edge ist auf den GitHub-Runnern meist vorinstalliert; sonst installiert Playwright es.
          command -v microsoft-edge-stable || npx playwright install --with-deps msedge
          microsoft-edge-stable --version
      # Klasse L und P: Chromium und 375 px (docs/ci-richtlinie.md, Abschnitt 7), Fälle nach Modul (CI-37).
      - name: Playwright gegen die laufende Demo (Chromium, 375 px)
        if: needs.umfang.outputs.browser_voll != 'true'
        run: |
          auswahl=()
          [ -n "$ABLAUF_GREP_INVERT" ] && auswahl=(--grep-invert "$ABLAUF_GREP_INVERT")
          npx playwright test --project=chromium --project=smartphone-375 "${auswahl[@]}"
      # Klasse O, I und unbekannte Pfade: alle Browser (AK-1101).
      - name: Playwright gegen die laufende Demo (Chromium, Firefox, Edge, 375 px)
        if: needs.umfang.outputs.browser_voll == 'true'
        run: |
          auswahl=()
          [ -n "$ABLAUF_GREP_INVERT" ] && auswahl=(--grep-invert "$ABLAUF_GREP_INVERT")
          npx playwright test --project=chromium --project=firefox --project=msedge --project=smartphone-375 "${auswahl[@]}"
      # UI-AK-16: axe auf allen Seiten, hell und dunkel, 1280 und 375 px (Chromium). Normal ca. 4 Minuten (CI-17).
      - name: Barrierefreiheit (axe)
        if: ${{ !cancelled() && needs.umfang.outputs.browser_voll == 'true' }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/a11y
        run: npx playwright test --project=a11y
      # Screenshots der vier Hauptseiten (Desktop/Handy, hell/dunkel). Normal unter 1 Minute (CI-17).
      - name: Screenshots der Hauptseiten
        if: ${{ !cancelled() && needs.umfang.outputs.browser_voll == 'true' }}
        timeout-minutes: 3
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/screenshots
        run: npx playwright test --project=screenshots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.umfang.outputs.browser_voll == 'true' }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Container-Logs
        if: failure()
        run: docker compose logs --no-color
      # CI-20: Testspuren nur bei einem Fehlschlag, höchstens 7 Tage.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Aufräumen
        if: always()
        run: docker compose down -v

  liferay625-schnell:
    name: Liferay 6.2.5, schnell
    needs: umfang
    if: needs.umfang.outputs.liferay625 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # CI-04: je Plattform höchstens ein schwerer Lauf gleichzeitig.
      group: liferay625-schnell-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liferay
          POSTGRES_PASSWORD: liferay
          POSTGRES_DB: liferay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liferay -d liferay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Nur Demo-Werte (CI-28). JDK, Cache und Bundle richtet das Skript ein (P00).
      LIFERAY_DB_URL: postgresql://liferay:liferay@localhost:5432/liferay
      LIFERAY_DB_HOST: localhost
      LIFERAY_DB_PORT: "5432"
      LIFERAY_DB_NAME: liferay
      LIFERAY_DB_USER: liferay
      LIFERAY_DB_PASSWORD: liferay
    steps:
      - uses: actions/checkout@v5
      - name: Skript liferay-625/ci/schnell.sh ausführen (sonst „noch nicht gebaut“)
        env:
          SKRIPT: liferay-625/ci/schnell.sh
          PLATTFORM: Liferay 6.2.5
          STUFE: schnell
        run: |
          if [ ! -f "$SKRIPT" ]; then
            echo "### $PLATTFORM, $STUFE: noch nicht gebaut" >> "$GITHUB_STEP_SUMMARY"
            echo "Das Skript \`$SKRIPT\` fehlt, der Job endet grün. Die Inhalte liefert das P00-Paket der Plattform." >> "$GITHUB_STEP_SUMMARY"
            echo "$SKRIPT fehlt: noch nicht gebaut"
            exit 0
          fi
          bash "$SKRIPT"

  liferay625-voll:
    name: Liferay 6.2.5, voll
    needs: umfang
    if: needs.umfang.outputs.liferay625_voll == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # CI-04: je Plattform höchstens ein schwerer Lauf gleichzeitig.
