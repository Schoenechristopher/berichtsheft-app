  abschluss:
    # CI-36: einziger Pflicht-Check. Ein übersprungener Job zählt bei GitHub als bestanden; dieser Job prüft
    # deshalb selbst, dass jeder für den Umfang nötige Job grün ist.
    name: Prüfung abgeschlossen
    needs: [umfang, checks, e2e, liferay625-schnell, liferay625-voll, liferay72-schnell, liferay72-voll]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ergebnisse der nötigen Jobs prüfen
        env:
          UMFANG: ${{ needs.umfang.result }}
          SCHNELL: ${{ needs.umfang.outputs.schnell }}
          CHECKS: ${{ needs.checks.result }}
          E2E_NOETIG: ${{ needs.umfang.outputs.e2e }}
          E2E: ${{ needs.e2e.result }}
          L625_SCHNELL_NOETIG: ${{ needs.umfang.outputs.liferay625 }}
          L625_SCHNELL: ${{ needs.liferay625-schnell.result }}
          L625_VOLL_NOETIG: ${{ needs.umfang.outputs.liferay625_voll }}
          L625_VOLL: ${{ needs.liferay625-voll.result }}
          L72_SCHNELL_NOETIG: ${{ needs.umfang.outputs.liferay72 }}
          L72_SCHNELL: ${{ needs.liferay72-schnell.result }}
          L72_VOLL_NOETIG: ${{ needs.umfang.outputs.liferay72_voll }}
          L72_VOLL: ${{ needs.liferay72-voll.result }}
        run: |
          fehler=0
          [ "$UMFANG" = success ] || { echo "Umfang: $UMFANG"; fehler=1; }
          if [ "$SCHNELL" = true ] && [ "$CHECKS" != success ]; then echo "Schnelle Prüfung: $CHECKS"; fehler=1; fi
          if [ "$E2E_NOETIG" = true ] && [ "$E2E" != success ]; then echo "Docker Compose + Playwright: $E2E"; fehler=1; fi
          # Liferay: übersprungen ist in Ordnung (Umfang meldet false), rot nicht; ein nötiger Job muss grün sein.
          pruefe() {
            if [ "$2" = true ] && [ "$3" != success ]; then echo "$1: $3"; fehler=1; fi
          }
          pruefe "Liferay 6.2.5, schnell" "$L625_SCHNELL_NOETIG" "$L625_SCHNELL"
          pruefe "Liferay 6.2.5, voll" "$L625_VOLL_NOETIG" "$L625_VOLL"
          pruefe "Liferay 7.2, schnell" "$L72_SCHNELL_NOETIG" "$L72_SCHNELL"
          pruefe "Liferay 7.2, voll" "$L72_VOLL_NOETIG" "$L72_VOLL"
          for ergebnis in "$L625_SCHNELL" "$L625_VOLL" "$L72_SCHNELL" "$L72_VOLL"; do
            case "$ergebnis" in failure|cancelled) fehler=1 ;; esac
          done
          [ "$fehler" = 0 ] && echo "Alle nötigen Jobs sind grün (Umfang: $UMFANG, schnell: $CHECKS, e2e: $E2E)."
          exit "$fehler"
