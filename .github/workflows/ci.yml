name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berichtsheft
          POSTGRES_PASSWORD: berichtsheft
          POSTGRES_DB: berichtsheft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U berichtsheft -d berichtsheft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://berichtsheft:berichtsheft@localhost:5432/berichtsheft_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatierung
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest (Logik, PDF und Datenbank)
        run: npm test
      - name: Testabdeckung der Akzeptanzkriterien (keine AK-ID ohne Test, docs/03-testabdeckung.md aktuell)
        run: npm run ak:abdeckung -- --pruefen
      - name: Beispiel-PDFs aus den Seed-Daten
        run: npm run pdf:beispiel
      - uses: actions/upload-artifact@v4
        with:
          name: beispiel-pdf
          path: beispiel-pdf/
          retention-days: 14

  e2e:
    name: Docker Compose + Playwright (Chromium, Firefox, Edge, 375 px, axe, Screenshots)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Prüft, dass der Produktions-Build den Test-Login trotzdem nicht anbietet (e2e/produktionsmodus.spec.ts).
      AUTH_TEST_LOGIN: "true"
      E2E_LOGIN_MODE: keycloak
      E2E_BASE_URL: http://localhost:3000
      E2E_DATABASE_URL: postgresql://berichtsheft:berichtsheft@localhost:5432/berichtsheft
      # E-Mails über die Mailpit-API prüfen (Etappe 6); der Worker im Compose-Stack versendet sie.
      E2E_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Images bauen
        run: docker compose build
      - name: Demo starten (app, worker, db, keycloak, mailpit)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Dienste prüfen
        run: |
          docker compose ps
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:8080/realms/berichtsheft/.well-known/openid-configuration > /dev/null
          curl -fsS http://localhost:8025/readyz
          for i in $(seq 1 30); do docker compose logs worker | grep -q "verbunden mit pg-boss" && break; sleep 2; done
          docker compose logs worker | grep "verbunden mit pg-boss"
      - name: Playwright-Browser installieren (Chromium, Firefox, Microsoft Edge)
        run: |
          npx playwright install --with-deps chromium firefox
          # Edge ist auf den GitHub-Runnern meist vorinstalliert; sonst installiert Playwright es.
          command -v microsoft-edge-stable || npx playwright install --with-deps msedge
          microsoft-edge-stable --version
      - name: Playwright gegen die laufende Demo (Chromium, Firefox, Edge, 375 px)
        run: npx playwright test --project=chromium --project=firefox --project=msedge --project=smartphone-375
      # UI-AK-16: axe auf allen Seiten, hell und dunkel, 1280 und 375 px (Chromium). Normal ca. 4 Minuten (CI-17).
      - name: Barrierefreiheit (axe)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/a11y
        run: npx playwright test --project=a11y
      # Screenshots der vier Hauptseiten (Desktop/Handy, hell/dunkel). Normal unter 1 Minute (CI-17).
      - name: Screenshots der Hauptseiten
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/screenshots
        run: npx playwright test --project=screenshots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Container-Logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Aufräumen
        if: always()
        run: docker compose down -v
